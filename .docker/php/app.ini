expose_php = 0
date.timezone = Europe/Paris

realpath_cache_size = 4096K
realpath_cache_ttl = 600

apc.enable_cli = 1

session.use_strict_mode = 1

; Upload limits. One file is capped at 20 MB (see App\Upload\UploadPolicy). The JavaScript uploader
; sends one file per request, but the no-JS fallback form posts up to 20 files at once:
; post_max_size therefore has to be well above a single file (100 MB total for the fallback).
upload_max_filesize = 20M
post_max_size = 100M
max_file_uploads = 20
memory_limit = 256M
