security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: /
            login_throttling:
                limiter: app.login_rate_limiter
            # SecurityBundle registers the /deconnexion route itself. Without a valid CSRF token
            # (only sent by the POST form in the header) the session is never closed.
            logout:
                path: /deconnexion
                enable_csrf: true
                # Matches the "csrf_token('logout')" used by the logout form.
                csrf_token_id: logout

    # No role hierarchy on purpose: administrators and clients are separate spaces.
    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/_styleguide, roles: PUBLIC_ACCESS }
        # Error page previews; the route itself is only loaded in the dev environment.
        - { path: ^/_error, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/espace, roles: ROLE_CLIENT }
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
