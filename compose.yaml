name: owner-docs

# Shared by php and worker: same image, same code, same environment.
x-php: &php
    image: ${COMPOSE_PROJECT_NAME:-owner-docs}-php
    build:
        context: .
        dockerfile: .docker/Dockerfile
        target: frankenphp_dev
        args:
            USER_ID: ${USER_ID:-1000}
            GROUP_ID: ${GROUP_ID:-1000}
    environment:
        SERVER_NAME: ":80"
        TZ: Europe/Paris
    volumes:
        - ./:/app
        - ./.docker/franken/Caddyfile:/etc/caddy/Caddyfile:ro
        - composer_cache:/home/www/.composer
        - caddy_data:/data
        - caddy_config:/config
    depends_on:
        database:
            condition: service_healthy

services:
    php:
        <<: *php
        ports:
            - "${HTTP_PORT:-8000}:80"

    # Consumes the async queue and the analysis schedule. A long-running process does not reload the code:
    # restart it after a change (make worker.restart). It is also recycled hourly or at 128M by Messenger itself.
    worker:
        <<: *php
        command: ["php", "bin/console", "messenger:consume", "async", "scheduler_analysis", "--time-limit=3600", "--memory-limit=128M", "-vv"]
        restart: unless-stopped
        # The image healthcheck probes Caddy, which the worker does not run.
        healthcheck:
            disable: true

    database:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
            TZ: Europe/Paris
            PGTZ: Europe/Paris
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - db_data:/var/lib/postgresql

volumes:
    composer_cache:
    caddy_data:
    caddy_config:
    db_data:
